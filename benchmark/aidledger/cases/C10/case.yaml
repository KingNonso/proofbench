title: Compact audit history while adding a retention column

description: >
  The migration adds a retention column to audit_events and, while it is
  there, removes events it judges redundant to keep the table small. The
  remaining history is coherent and every constraint holds. The removed events
  are the ones someone would look for after an incident.

