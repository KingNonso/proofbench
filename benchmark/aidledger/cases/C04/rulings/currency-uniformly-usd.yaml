question_id: AQ-001

reviewer_role: Finance operations owner
reviewer_qualification: Owner of historical payment records for all organisations

ruling_text: >
  Payments recorded before the currency field was introduced were all settled
  through the USD clearing account. The absent value reflects a field that did
  not exist, not a currency that differed. Backfilling USD is correct for every
  affected row.

scope_table: payments
scope_predicate: currency_code IS NULL
determination_column: currency_code
determination_value: USD

justification: >
  Confirmed against the 2023 settlement ledger held by finance operations. Every
  pre-2024 disbursement for both organisations cleared through the USD account;
  local-currency settlement began only after the currency field was added.

