title: Restore payments policies for the application role only

description: >
  The migration recreates payments and, unlike C01, does remember row-level
  security. It restores ENABLE, FORCE and the application policy. It does not
  restore the organisation-administrator read policy, and the auditor is left
  without the access the policy grants. The application works, so nothing a
  developer would try reveals the gap.

