# All six jobs from implementation-plan.md section 16. Each verifies something
# real; a job that verified nothing would be worse than a missing one, because it
# would look like coverage.
#
# No provider variable is set anywhere in this workflow, and the `replay` job
# proves the judge path needs none.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src

  unit:
    name: unit and schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      # Docker-backed tests belong to the job below; running them twice would
      # only slow the feedback loop.
      - run: uv run pytest -m "not integration and not security and not e2e"

  docker:
    name: sandbox, containment, and end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - run: docker pull "$(grep -oE 'postgres:16@sha256:[0-9a-f]{64}' compose.yaml | head -1)"
      # No provider variable is set anywhere in this workflow. The offline path
      # must never depend on one.
      - run: uv run pytest -m "integration or security or e2e"

  replay:
    name: offline replay, no provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      # The Anthropic SDK is an optional extra that `uv sync` does not install,
      # so a provider call here is unavailable rather than merely unused.
      - name: confirm the provider SDK is absent
        run: |
          uv run python -c "
          import importlib.util, sys
          if importlib.util.find_spec('anthropic') is not None:
              sys.exit('the judge path must not have the provider SDK installed')
          print('provider SDK absent, as required')
          "
      - run: docker pull "$(grep -oE 'postgres:16@sha256:[0-9a-f]{64}' compose.yaml | head -1)"
      - run: make replay

  evaluation:
    name: metrics recompute from committed runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      # make baseline must fail honestly until committed PRD-FR-002
      # direct-review records exist. Requiring success here would force either
      # a fabricated baseline or a permanently red pipeline; instead CI asserts
      # the failure is the *documented* one, naming the missing arm.
      - name: baseline names its missing evidence honestly
        run: |
          set +e
          out=$(make baseline 2>&1); code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "make baseline passed but the direct-review arm has never run"; exit 1
          fi
          echo "$out" | grep -q "missing required baseline_direct_review arm"
      # Fails if summary.json does not follow from raw-runs.jsonl, so a
      # submitted number cannot drift from the runs it came from.
      - run: make evaluate

  submission:
    name: required documents and artifact links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run pytest tests/e2e/test_submission.py -v
