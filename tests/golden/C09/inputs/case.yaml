schema_version: "1.1"
case_id: C09
title: Settle approved payments through a retried dual-write path

description: >
  The migration settles approved payments by writing a disbursement, and wraps
  the write in a retry so a transient failure does not abort the deploy. The
  retry mints a fresh idempotency key, so the unique constraint that exists to
  prevent double payment never fires.

